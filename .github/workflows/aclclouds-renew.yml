name: ACLClouds Auto Renew

on:
  schedule:
    # 北京时间 07:43 / 15:43 / 23:43 各一次
    # 续期窗口为到期前 48 小时, 一天 3 次 => 窗口内有约 6 次机会, 不怕单次失败
    - cron: "43 23,7,15 * * *"
  workflow_dispatch: # 支持手动点 "Run workflow" 测试

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不要开 cache: pip —— 它强制要求仓库里有 requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "seleniumbase>=4.30.0" "requests>=2.31.0"

      - name: Ensure Chrome and Xvfb
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          google-chrome --version

      # xray 由脚本自动下载, 不再需要安装 gost

      - name: Run renew (Xvfb 虚拟显示器)
        env:
          ACL_USERNAME: ${{ secrets.ACL_USERNAME }}
          ACL_PASSWORD: ${{ secrets.ACL_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          VMESS_LINK: ${{ secrets.VMESS_LINK }}
          # 节点是自签证书时打开下一行
          # VMESS_INSECURE: '1'
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # 不管 py 文件放在仓库根目录还是子文件夹都能找到
          SCRIPT=$(find . -name aclclouds_renew.py -not -path '*/.git/*' | head -1)
          echo "Using script: $SCRIPT"
          if [ -z "$SCRIPT" ]; then
            echo "❌ 仓库里没找到 aclclouds_renew.py，请确认脚本已上传"
            find . -type f | head -50
            exit 1
          fi
          python "$SCRIPT"

      - name: Upload screenshots (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aclclouds-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
