name: EKNodes Auto Renew

on:
  workflow_dispatch:          # 支持在 GitHub Actions 网页端手动点击触发
  repository_dispatch:
    types: [ek_renew]         # 接收青龙面板、外部脚本或 VPS 发送的自动化唤醒事件

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies (For Browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install gost (Proxy)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gzip -d gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow seleniumbase

      - name: Run EKNodes Renew Script
        env:
          EK_COOKIE: ${{ secrets.EK_COOKIE }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u ek_renew.py
