name: EKNodes Auto Renew

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ek_renew]

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For Browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install xray (VMess/HY2 -> SOCKS5)
        run: |
          XRAY_URL="https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip"
          wget -q "$XRAY_URL" -O /tmp/xray.zip
          unzip -o /tmp/xray.zip xray -d /usr/local/bin/
          chmod +x /usr/local/bin/xray

      - name: Start xray (dedicated proxy)
        env:
          XRAY_CONFIG: ${{ secrets.EK_XRAY_CONFIG }}
          QUIC_GO_DISABLE_GSO: "1"
        run: |
          echo "$XRAY_CONFIG" > /tmp/xray_config.json
          echo "--- JSON 校验 ---"
          python3 -c "import json; json.load(open('/tmp/xray_config.json')); print('JSON OK')"
          echo "--- xray 配置测试 ---"
          /usr/local/bin/xray -test -c /tmp/xray_config.json
          nohup xray run -c /tmp/xray_config.json > /tmp/xray.log 2>&1 &
          sleep 4
          echo "--- xray 启动日志 ---"
          cat /tmp/xray.log
          echo "--- 代理自检 (verbose) ---"
          curl -s --max-time 10 -x socks5h://127.0.0.1:11808 https://httpbin.org/ip && echo "xray socks OK"
          curl -s --max-time 10 -x http://127.0.0.1:18080 https://httpbin.org/ip && echo "xray http OK"

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow seleniumbase curl_cffi

      - name: Run EKNodes Renew Script
        env:
          EK_COOKIE: ${{ secrets.EK_COOKIE }}
          HTTP_PROXY_URL: http://127.0.0.1:18080
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u ek_renew.py
