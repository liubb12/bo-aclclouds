name: EKNodes Auto Renew

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ek_renew]

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (For Browser)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install sing-box (HY2 -> SOCKS5/HTTP)
        run: |
          SB_VER=$(curl -s https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep '"tag_name"' | head -1 | cut -d'"' -f4)
          echo "sing-box version: $SB_VER"
          curl -sL "https://github.com/SagerNet/sing-box/releases/download/${SB_VER}/sing-box-${SB_VER#v}-linux-amd64.tar.gz" -o /tmp/sb.tgz
          tar xzf /tmp/sb.tgz -C /tmp
          sudo install -m 0755 /tmp/sing-box-*/sing-box /usr/local/bin/sing-box
          sing-box version

      - name: Start sing-box (dedicated proxy)
        env:
          XRAY_CONFIG: ${{ secrets.EK_XRAY_CONFIG }}
          QUIC_GO_DISABLE_GSO: "1"
        run: |
          echo "$XRAY_CONFIG" > /tmp/sb_config.json
          echo "--- JSON 校验 ---"
          python3 -c "import json; json.load(open('/tmp/sb_config.json')); print('JSON OK')"
          echo "--- sing-box 配置测试 ---"
          /usr/local/bin/sing-box check -c /tmp/sb_config.json
          nohup sing-box run -c /tmp/sb_config.json > /tmp/singbox.log 2>&1 &
          sleep 4
          echo "--- sing-box 启动日志 ---"
          cat /tmp/singbox.log
          echo "--- 代理自检: 直连对照 ---"
          DIRECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://dash.eknodes.es/servers) || DIRECT_CODE="000"
          echo "直连 HTTP_CODE=$DIRECT_CODE (预期 429=被 Vercel 拦截, 对照用)"
          echo "--- 代理自检: 经代理访问真实目标 ---"
          PROXY_CODE=$(curl -s -o /tmp/probe.html -w "%{http_code}" --max-time 25 -x http://127.0.0.1:18080 https://dash.eknodes.es/servers) || PROXY_CODE="000"
          echo "代理 HTTP_CODE=$PROXY_CODE"
          echo "页面标题: $(grep -o '<title>[^<]*</title>' /tmp/probe.html 2>/dev/null | head -1)"
          if [ "$PROXY_CODE" = "000" ]; then
            echo "--- 失败诊断 (-v, 只看握手阶段) ---"
            curl -v --max-time 15 -x http://127.0.0.1:18080 https://dash.eknodes.es/servers -o /dev/null 2>&1 | grep -E "^(<|>|\*)" | tail -30 || true
            echo "--- sing-box 完整日志 ---"
            cat /tmp/singbox.log
            echo "代理链路未建立，停止"
            exit 1
          fi

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install requests pillow seleniumbase curl_cffi

      - name: Run EKNodes Renew Script
        env:
          EK_COOKIE: ${{ secrets.EK_COOKIE }}
          HTTP_PROXY_URL: http://127.0.0.1:18080
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u ek_renew.py
