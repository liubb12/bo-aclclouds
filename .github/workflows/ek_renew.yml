name: EKNodes Auto Renew

on:
  schedule:
    - cron: '30 2 */2 * *'  # 每 2 天的 UTC 02:30（北京时间 10:30）自动巡检一次
  workflow_dispatch:         # 支持手动触发

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb wget

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install seleniumbase requests

      - name: Install gost (Proxy)
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gzip -d gost-linux-amd64-2.11.5.gz
          chmod +x gost-linux-amd64-2.11.5
          sudo mv gost-linux-amd64-2.11.5 /usr/local/bin/gost

      - name: Run EKNodes Renew Script
        env:
          EK_EMAIL: ${{ secrets.EK_EMAIL }}
          EK_USERNAME: ${{ secrets.EK_USERNAME }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u ek_renew.py
