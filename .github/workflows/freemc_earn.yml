name: Run Freemchosting Earn Script

on:
  workflow_dispatch: # 支持手动触发测试
  schedule:
    - cron: '30 2 * * *' # 每天 UTC 时间 02:30（北京时间 10:30）自动运行一次

jobs:
  run-freemc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Run Freemchosting Earn Script
        env:
          FREEMC_USER: ${{ secrets.FREEMC_USER }}
          FREEMC_PASS: ${{ secrets.FREEMC_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python freemc_earn.py
