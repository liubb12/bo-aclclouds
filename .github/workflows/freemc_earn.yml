name: Run Freemchosting Earn Script

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * *'

jobs:
  run-freemc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install seleniumbase requests

      - name: Run Freemchosting Earn Script
        env:
          FREEMC_USER: ${{ secrets.FREEMC_USER }}
          FREEMC_PASS: ${{ secrets.FREEMC_PASS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python freemc_earn.py
