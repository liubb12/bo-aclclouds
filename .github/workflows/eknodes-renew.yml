name: eknodes Auto Renew

on:
  schedule:
    # UTC 23:43 / 11:43 = 北京时间 07:43 / 19:43，一天 2 次
    # 续期规则: 每天可点 1 次, 每次到期日 +1 天, 剩余上限 7 天。
    # 一天 2 跑: 早上 Turnstile 没过, 晚上还有一次补回, 不会断保活。
    - cron: "43 23,11 * * *"
  workflow_dispatch: # 支持手动点 "Run workflow" 测试

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不要开 cache: pip —— 它强制要求仓库根目录有 requirements.txt 结构

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "seleniumbase>=4.30.0" "requests>=2.31.0" "requests[socks]"

      - name: Ensure Chrome and Xvfb
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          google-chrome --version

      # 配了 NODE_LINK (vmess:// / vless://) 才装 sing-box 起本地代理
      # 注意: secrets 不能用在 if: 条件里, 只能在 run 脚本里判空
      - name: Setup sing-box proxy (住宅节点)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          if [ -z "$NODE_LINK" ]; then
            echo "ℹ️ 未配置 NODE_LINK，跳过代理设置"
            exit 0
          fi
          SB_VER=$(curl -sL https://api.github.com/repos/SagerNet/sing-box/releases/latest | grep -oP '"tag_name":\s*"v?\K[^"]+')
          curl -sL -o sing-box.tar.gz "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf sing-box.tar.gz
          sudo mv sing-box-*/sing-box /usr/local/bin/sing-box
          rm -rf sing-box.tar.gz sing-box-*/
          # VMess 链接 -> sing-box 配置, 本地监听 127.0.0.1:1080
          CONV=$(find . -name node_to_singbox.py -not -path '*/.git/*' | head -1)
          PROXY_URL=$(python "$CONV" | tail -1)
          echo "PROXY_SERVER=$PROXY_URL" >> $GITHUB_ENV
          echo "Local proxy: $PROXY_URL"
          # 后台启动并验证连通
          nohup sing-box run -c singbox_config.json >/tmp/sing-box.log 2>&1 &
          sleep 3
          # 打印 sing-box 配置（脱敏 uuid）
          python -c "import json; j=json.load(open('singbox_config.json')); o=j['outbounds'][0]; o['uuid']=o.get('uuid','')[:4]+'...' if 'uuid' in o else ''; print(json.dumps(o, ensure_ascii=False, indent=2))"
          # 测试: 通过代理访问 eknodes 登录页, HTTP 200 即算连通
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -x "$PROXY_URL" "https://dash.eknodes.es/login")
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
            echo "✅ 代理连通 OK (HTTP $HTTP_CODE)"
          else
            echo "⚠️ 代理连通测试 HTTP $HTTP_CODE，继续运行（代理可能仅不支持海外 DNS 查询，不影响站点访问）"
          fi

      - name: Run renew (Xvfb 虚拟显示器)
        env:
          EK_EMAIL: ${{ secrets.EK_EMAIL }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
          EK_MAX_DAYS: ${{ vars.EK_MAX_DAYS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ env.PROXY_SERVER || secrets.PROXY_SERVER }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # py 文件放仓库任意目录都能找到
          SCRIPT=$(find . -name eknodes_renew.py -not -path '*/.git/*' | head -1)
          echo "Using script: $SCRIPT"
          if [ -z "$SCRIPT" ]; then
            echo "❌ 仓库里没找到 eknodes_renew.py"
            find . -type f | head -50
            exit 1
          fi
          echo "PROXY 状态: ${PROXY_SERVER:+已配置}"
          python "$SCRIPT"

      - name: Upload screenshots (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eknodes-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
