name: eknodes Auto Renew

on:
  schedule:
    # UTC 23:43 / 11:43 = 北京时间 07:43 / 19:43，一天 2 次
    # 续期规则: 每天可点 1 次, 每次到期日 +1 天, 剩余上限 7 天。
    # 一天 2 跑: 早上 Turnstile 没过, 晚上还有一次补回, 不会断保活。
    - cron: "43 23,11 * * *"
  workflow_dispatch: # 支持手动点 "Run workflow" 测试

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          # 不要开 cache: pip —— 它强制要求仓库根目录有 requirements.txt 结构

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install "seleniumbase>=4.30.0" "requests>=2.31.0" "requests[socks]"

      - name: Ensure Chrome and Xvfb
        run: |
          if ! command -v google-chrome >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
          if ! command -v Xvfb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          google-chrome --version

      - name: Run renew (Xvfb 虚拟显示器)
        env:
          EK_EMAIL: ${{ secrets.EK_EMAIL }}
          EK_PASSWORD: ${{ secrets.EK_PASSWORD }}
          EK_MAX_DAYS: ${{ vars.EK_MAX_DAYS }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          # py 文件放仓库任意目录都能找到
          SCRIPT=$(find . -name eknodes_renew.py -not -path '*/.git/*' | head -1)
          echo "Using script: $SCRIPT"
          if [ -z "$SCRIPT" ]; then
            echo "❌ 仓库里没找到 eknodes_renew.py"
            find . -type f | head -50
            exit 1
          fi
          python "$SCRIPT"

      - name: Upload screenshots (失败时排查用)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eknodes-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7
