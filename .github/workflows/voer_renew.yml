name: VOER Host Auto Renew

on:
  schedule:
    - cron: '38 23 12 9 *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Gost Proxy & Dependencies
        run: |
          # 安装 gost 官方发布版
          curl -fL https://github.com/go-gost/gost/releases/download/v3.0.0/gost_3.0.0_linux_amd64.tar.gz -o gost.tar.gz || \
          curl -fsSL https://pkg.gost.run/install.sh | bash || true

          if [ -f gost.tar.gz ]; then
            tar -zxvf gost.tar.gz
            sudo mv gost /usr/local/bin/
            rm -f gost.tar.gz
          fi

          # 安装虚拟桌面及 Python 依赖
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install requests seleniumbase
          sbase install chromedriver

      - name: Run Renew Script
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_COOKIES: ${{ secrets.VOER_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
        run: |
          touch output.log
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u renew_voer.py 2>&1 | tee -a output.log

      - name: 上传排查截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore

      - name: 更新 Cron
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.REPO_TOKEN }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          NEXT_RUN_UTC=$(grep -oP 'NEXT_RUN_UTC=\K.*' output.log | tail -1)
          if [ -n "$NEXT_RUN_UTC" ]; then
            echo "下次运行时间 (UTC): $NEXT_RUN_UTC"
            CRON=$(date -u -d "$NEXT_RUN_UTC" +"%-M %-H %-d %-m *")
            echo "新 cron: $CRON"

            WORKFLOW_FILE=$(grep -lE "^name:\s*['\"]?$WORKFLOW_NAME['\"]?\s*$" .github/workflows/*.yml .github/workflows/*.yaml 2>/dev/null | head -1)
            if [ -z "$WORKFLOW_FILE" ]; then
              echo "❌ 未找到匹配的工作流文件，跳过 cron 更新"
              exit 0
            fi

            echo "找到工作流文件: $WORKFLOW_FILE"
            sed -i "0,/cron: '.*'/s//cron: '$CRON'/" "$WORKFLOW_FILE"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # 仅暂存更新后的 workflow 文件并提交
            git add "$WORKFLOW_FILE"
            COMMIT_MSG="下次执行时间：$(date -u -d "$NEXT_RUN_UTC" '+%Y年%m月%d日 %H:%M UTC')"
            git commit -m "$COMMIT_MSG" || echo "没有变更需要提交"

            # 彻底清理运行产生的图片、log 等未追踪文件，避免阻碍 git rebase
            git checkout -- . 2>/dev/null || true
            git clean -fd

            # 拉取最新提交并推送
            git pull --rebase origin main
            git push origin main
            echo "✅ Cron 已自动更新并成功推送！"
          else
            echo "未检测到 NEXT_RUN_UTC，跳过 cron 更新"
          fi
