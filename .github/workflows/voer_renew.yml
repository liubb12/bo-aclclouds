name: VOER Host Auto Renew

on:
  schedule:
    # 固定每 3 小时整点轮询一次 (UTC 时间 0, 3, 6, 9, 12, 15, 18, 21 点)
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Gost Proxy & Dependencies
        run: |
          # 安装 gost 官方发布版
          curl -fL https://github.com/go-gost/gost/releases/download/v3.0.0/gost_3.0.0_linux_amd64.tar.gz -o gost.tar.gz || \
          curl -fsSL https://pkg.gost.run/install.sh | bash || true

          if [ -f gost.tar.gz ]; then
            tar -zxvf gost.tar.gz
            sudo mv gost /usr/local/bin/
            rm -f gost.tar.gz
          fi

          # 安装虚拟桌面及 Python 依赖
          sudo apt-get update
          sudo apt-get install -y xvfb
          python -m pip install --upgrade pip
          pip install requests seleniumbase
          sbase install chromedriver

      - name: Run Renew Script
        env:
          VOER_SERVER_ID: ${{ secrets.VOER_SERVER_ID }}
          VOER_COOKIES: ${{ secrets.VOER_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SOCKS5_PROXY: ${{ secrets.SOCKS5_PROXY }}
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" python -u renew_voer.py

      - name: 上传排查截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
          if-no-files-found: ignore
